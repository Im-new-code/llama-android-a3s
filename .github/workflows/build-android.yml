name: Build lean llama.cpp for Android API 27 ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip wget

      - name: Download Android NDK r27d
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          echo "ANDROID_NDK=$GITHUB_WORKSPACE/android-ndk-r27d" >> "$GITHUB_ENV"

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

      - name: Configure lean ARM64 build
        run: |
          cmake -S llama.cpp -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-27 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_FLAGS="-Oz" \
            -DCMAKE_CXX_FLAGS="-Oz" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_OPENCL=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_METAL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_RPC=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=ON \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_OPENSSL=OFF

      - name: Build unified llama
        run: |
          cmake --build build --target llama -j2

      - name: Strip executable
        run: |
          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-all \
            build/bin/llama

      - name: Check executable
        run: |
          file build/bin/llama
          ls -lh build/bin/llama

      - name: Package
        run: |
          mkdir -p release
          cp build/bin/llama release/llama
          chmod +x release/llama

          cd release
          zip -9 ../llama-android-arm64-api27-lean.zip llama

      - name: Show final size
        run: |
          ls -lh build/bin/llama
          ls -lh llama-android-arm64-api27-lean.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-arm64-api27-lean
          path: llama-android-arm64-api27-lean.zip
          retention-days: 7
