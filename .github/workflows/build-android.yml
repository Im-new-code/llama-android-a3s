name: Build Minimal llama.cpp for Android 8.1 ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip wget

      - name: Download Android NDK r27d
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r27d" >> "$GITHUB_ENV"

      - name: Clone verified llama.cpp revision
        run: |
          git clone --depth 1 --branch b7172 https://github.com/ggml-org/llama.cpp.git

      - name: Configure minimal ARM64 Android build
        working-directory: llama.cpp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-27 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_FLAGS="-Oz" \
            -DCMAKE_CXX_FLAGS="-Oz" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_OPENCL=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DGGML_RPC=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_TOOLS_INSTALL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_HTTPLIB=OFF \
            -DLLAMA_OPENSSL=OFF

      - name: Build only llama-cli
        working-directory: llama.cpp
        run: |
          cmake --build build --target llama-cli -j2

      - name: Strip executable
        run: |
          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-all llama.cpp/build/bin/llama-cli

      - name: Check binary
        run: |
          ls -lh llama.cpp/build/bin/llama-cli
          file llama.cpp/build/bin/llama-cli

      - name: Package binary
        run: |
          mkdir -p output
          cp llama.cpp/build/bin/llama-cli output/llama-cli
          cd output
          zip -9 ../llama-cli-android-arm64-api27.zip llama-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-android-arm64-api27
          path: llama-cli-android-arm64-api27.zip
