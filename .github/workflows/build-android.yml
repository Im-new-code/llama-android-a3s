name: Build Minimal llama-cli for Android A3s

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip wget git file

      - name: Download Android NDK r27d
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          echo "ANDROID_NDK=$GITHUB_WORKSPACE/android-ndk-r27d" >> "$GITHUB_ENV"

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 --branch b4650 https://github.com/ggml-org/llama.cpp.git

      - name: Configure
        run: |
          cmake -S llama.cpp -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-27 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_FLAGS="-Oz" \
            -DCMAKE_CXX_FLAGS="-Oz" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_OPENCL=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DGGML_RPC=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_OPENSSL=OFF

      - name: Build llama-cli
        run: |
          cmake --build build --target llama-cli -j2

      - name: Find executable
        run: |
          find build -type f -name "llama-cli" -print

      - name: Strip
        run: |
          mkdir -p release
          cp "$(find build -type f -name llama-cli -perm -111 | head -n 1)" release/llama
          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-all release/llama

      - name: Verify
        run: |
          file release/llama
          ls -lh release/llama

      - name: Package
        run: |
          cd release
          zip -9 ../llama-a3s-minimal.zip llama

      - name: Show size
        run: |
          ls -lh release/llama
          ls -lh llama-a3s-minimal.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-a3s-minimal
          path: llama-a3s-minimal.zip
          retention-days: 7
