name: Build JARVIS Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify source archive
        run: |
          test -f jarvis-source.zip || {
            echo "ERROR: jarvis-source.zip was not found in repository root."
            exit 1
          }

          echo "Source archive:"
          ls -lh jarvis-source.zip

          echo
          echo "Archive contents:"
          unzip -l jarvis-source.zip

      - name: Extract JARVIS source
        run: |
          rm -rf jarvis-src
          mkdir -p jarvis-src

          unzip -q jarvis-source.zip -d jarvis-src

          echo "Extracted project:"
          find jarvis-src -maxdepth 3 -type f | sort

      - name: Verify project structure
        run: |
          required_files=(
            "jarvis-src/settings.gradle"
            "jarvis-src/build.gradle"
            "jarvis-src/gradle.properties"
            "jarvis-src/app/build.gradle"
            "jarvis-src/app/src/main/AndroidManifest.xml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo
              echo "ERROR: Missing required file:"
              echo "$file"
              echo
              echo "Your ZIP must contain the Android project directly at its root."
              echo "Correct:"
              echo "  settings.gradle"
              echo "  build.gradle"
              echo "  gradle.properties"
              echo "  app/"
              echo
              echo "Incorrect:"
              echo "  jarvis-source/settings.gradle"
              echo "  jarvis-source/app/"
              exit 1
            fi
          done

          echo
          echo "JARVIS project structure verified successfully."

      - name: Download Sherpa ONNX
        run: |
          SHERPA_VERSION="1.13.8"
          SHERPA_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar"

          wget -q \
            --show-progress \
            "$SHERPA_URL" \
            -O "jarvis-src/app/sherpa-onnx.aar"

          test -s "jarvis-src/app/sherpa-onnx.aar"

          echo
          echo "Sherpa ONNX AAR:"
          ls -lh "jarvis-src/app/sherpa-onnx.aar"

      - name: Install Gradle 8.7
        run: |
          GRADLE_VERSION="8.7"

          wget -q \
            --show-progress \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        working-directory: jarvis-src
        run: |
          gradle --version
          gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build JARVIS debug APK
        working-directory: jarvis-src
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Verify APK exists
        run: |
          APK="jarvis-src/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "ERROR: APK was not produced."
            find jarvis-src/app/build/outputs -type f 2>/dev/null || true
            exit 1
          }

          echo "APK successfully produced:"
          ls -lh "$APK"

          echo
          echo "APK information:"
          file "$APK"

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: jarvis-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
