name: Build JARVIS Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract JARVIS source
        run: |
          rm -rf jarvis-src
          mkdir -p jarvis-src
          unzip -q jarvis-source.zip -d jarvis-src

          echo "JARVIS source:"
          find jarvis-src -maxdepth 4 -type f | sort

      - name: Download Sherpa ONNX AAR
        working-directory: jarvis-src
        run: |
          wget -q \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar" \
            -O app/sherpa-onnx.aar

          echo "Sherpa AAR:"
          ls -lh app/sherpa-onnx.aar

      - name: Install Gradle
        run: |
          wget -q \
            "https://services.gradle.org/distributions/gradle-8.7-bin.zip" \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        working-directory: jarvis-src
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Verify project structure
        working-directory: jarvis-src
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Project structure verified."

      - name: Build debug APK
        working-directory: jarvis-src
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Show APK
        working-directory: jarvis-src
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: jarvis-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
