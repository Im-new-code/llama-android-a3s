name: Build JARVIS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS for Android ARM64
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "27"
      NDK_VERSION: "27.2.12479018"
      GRADLE_VERSION: "8.7"
      AGP_VERSION: "8.5.2"

      # Pinned llama.cpp revision.
      # This is from the same llama.cpp generation as the
      # llama-cli binary already tested on the phone.
      LLAMA_CPP_COMMIT: "b78db3b"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"


      # ============================================================
      # 4. DOWNLOAD NDK
      # ============================================================

      - name: Download Android NDK r27d
        run: |
          wget -q \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip

          unzip -q android-ndk-r27d-linux.zip

          echo "ANDROID_NDK=$GITHUB_WORKSPACE/android-ndk-r27d" >> "$GITHUB_ENV"


      # ============================================================
      # 5. DOWNLOAD GRADLE
      # ============================================================

      - name: Download Gradle
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip

          unzip -q \
            gradle-${GRADLE_VERSION}-bin.zip \
            -d "$RUNNER_TEMP"

          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-${GRADLE_VERSION}" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          gradle --version


      # ============================================================
      # 6. CLONE LLAMA.CPP
      # ============================================================

      - name: Clone llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git

          cd llama.cpp

          git checkout "$LLAMA_CPP_COMMIT"

          echo "llama.cpp revision:"
          git rev-parse HEAD


      # ============================================================
      # 7. BUILD LLAMA.CPP
      # ============================================================

      - name: Configure llama.cpp
        run: |
          cmake \
            -S llama.cpp \
            -B llama-build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_OPENCL=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_METAL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_RPC=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF

      - name: Build llama-cli
        run: |
          cmake \
            --build llama-build \
            --target llama-cli \
            -j2

          find llama-build \
            -type f \
            -name "llama-cli" \
            -print

          test -f llama-build/bin/llama-cli


      # ============================================================
      # 8. VERIFY LLAMA BINARY
      # ============================================================

      - name: Verify llama-cli
        run: |
          ls -lh llama-build/bin/llama-cli

          file llama-build/bin/llama-cli

          chmod +x llama-build/bin/llama-cli

          echo "llama-cli successfully built."


      # ============================================================
      # 9. GENERATE ANDROID PROJECT
      # ============================================================

      - name: Generate Android project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/imnewcode/jarvis
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets


          # ========================================================
          # settings.gradle
          # ========================================================

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "JARVIS"

include(":app")
EOF


          # ========================================================
          # root build.gradle
          # ========================================================

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.5.2' apply false
}
EOF


          # ========================================================
          # gradle.properties
          # ========================================================

          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.enableJetifier=false
EOF


          # ========================================================
          # app/build.gradle
          # ========================================================

          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.imnewcode.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.imnewcode.jarvis'

        minSdk 27

        /*
         * Important:
         *
         * We deliberately target API 28 or lower.
         *
         * This prototype executes the packaged llama-cli binary
         * from the application's private directory.
         */
        targetSdk 28

        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
EOF


          # ========================================================
          # AndroidManifest.xml
          # ========================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<manifest
    xmlns:android="http://schemas.android.com/apk/res/android">

    <!--
        Android 8.1 uses this permission for reading shared/external
        storage.

        This is intentionally present because the first prototype
        needs to find the user's existing GGUF model without copying
        it into the application.
    -->
    <uses-permission
        android:name="android.permission.READ_EXTERNAL_STORAGE" />

    <application
        android:allowBackup="false"
        android:label="JARVIS"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="false">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>

                <action
                    android:name="android.intent.action.MAIN" />

                <category
                    android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
EOF


          # ========================================================
          # styles.xml
          # ========================================================

          cat > app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<resources>

    <style
        name="AppTheme"
        parent="@android:style/Theme.Material.NoActionBar">

        <item name="android:fontFamily">sans</item>

        <item name="android:windowActionModeOverlay">true</item>

        <item name="android:colorAccent">#8AB4F8</item>

        <item name="android:navigationBarColor">#08090C</item>

        <item name="android:statusBarColor">#08090C</item>

        <item name="android:windowLightStatusBar">false</item>

    </style>

</resources>
EOF


          # ========================================================
          # MainActivity.java
          # ========================================================

          cat > app/src/main/java/com/imnewcode/jarvis/MainActivity.java <<'EOF'
package com.imnewcode.jarvis;

import android.Manifest;
import android.app.Activity;
import android.os.Bundle;
import android.os.Build;
import android.os.Handler;
import android.os.Looper;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.graphics.Color;
import android.graphics.Typeface;
import android.net.Uri;
import android.provider.Settings;
import android.view.Gravity;
import android.view.View;
import android.view.ViewGroup;
import android.widget.*;

import java.io.*;
import java.util.*;
import java.util.concurrent.atomic.AtomicBoolean;

public class MainActivity extends Activity {

    private LinearLayout root;
    private LinearLayout messages;
    private ScrollView scroll;

    private EditText input;
    private Button sendButton;
    private Button modelButton;

    private TextView status;
    private TextView modelStatus;

    private final Handler mainHandler =
            new Handler(Looper.getMainLooper());

    private Process llamaProcess;

    private final AtomicBoolean generating =
            new AtomicBoolean(false);

    private final ArrayList<String[]> history =
            new ArrayList<>();

    private File modelFile;

    private static final int REQUEST_STORAGE = 1001;
    private static final int REQUEST_MODEL = 1002;

    private static final String APP_NAME = "JARVIS";

    private static final String SYSTEM_PROMPT =
            "You are JARVIS, a helpful offline personal AI assistant. " +
            "Answer clearly and naturally. " +
            "Be concise when the question is simple and explain things " +
            "properly when explanation is needed. " +
            "Do not claim to have internet access. " +
            "Do not mention hidden reasoning. " +
            "Do not output <think> sections. " +
            "Answer the user's actual question directly.";

    @Override
    protected void onCreate(Bundle state) {

        super.onCreate(state);

        requestStoragePermission();

        buildInterface();

        findModelAutomatically();
    }


    private void requestStoragePermission() {

        if (Build.VERSION.SDK_INT >= 23 &&
                checkSelfPermission(
                        Manifest.permission.READ_EXTERNAL_STORAGE)
                        != PackageManager.PERMISSION_GRANTED) {

            requestPermissions(
                    new String[]{
                            Manifest.permission.READ_EXTERNAL_STORAGE
                    },
                    REQUEST_STORAGE
            );
        }
    }


    private int dp(int value) {

        return (int) (
                value *
                getResources().getDisplayMetrics().density
        );
    }


    private TextView text(
            String value,
            float size,
            int color) {

        TextView t = new TextView(this);

        t.setText(value);
        t.setTextSize(size);
        t.setTextColor(color);

        return t;
    }


    private void buildInterface() {

        root = new LinearLayout(this);

        root.setOrientation(LinearLayout.VERTICAL);

        root.setBackgroundColor(
                Color.rgb(8, 9, 12)
        );


        // ==========================================================
        // HEADER
        // ==========================================================

        LinearLayout header =
                new LinearLayout(this);

        header.setOrientation(
                LinearLayout.HORIZONTAL
        );

        header.setGravity(Gravity.CENTER_VERTICAL);

        header.setPadding(
                dp(18),
                dp(12),
                dp(12),
                dp(12)
        );


        TextView title =
                text(
                        APP_NAME,
                        21,
                        Color.WHITE
                );

        title.setTypeface(
                Typeface.DEFAULT_BOLD
        );


        header.addView(
                title,
                new LinearLayout.LayoutParams(
                        0,
                        ViewGroup.LayoutParams.WRAP_CONTENT,
                        1
                )
        );


        TextView offline =
                text(
                        "● OFFLINE",
                        12,
                        Color.rgb(120, 220, 150)
                );

        header.addView(offline);


        root.addView(
                header,
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        ViewGroup.LayoutParams.WRAP_CONTENT
                )
        );


        // ==========================================================
        // MODEL BAR
        // ==========================================================

        LinearLayout modelBar =
                new LinearLayout(this);

        modelBar.setOrientation(
                LinearLayout.VERTICAL
        );

        modelBar.setPadding(
                dp(14),
                dp(6),
                dp(14),
                dp(8)
        );


        modelStatus =
                text(
                        "Model: searching...",
                        12,
                        Color.LTGRAY
                );

        modelBar.addView(modelStatus);


        modelButton =
                new Button(this);

        modelButton.setText(
                "Choose GGUF model"
        );

        modelButton.setOnClickListener(
                v -> chooseModel()
        );

        modelBar.addView(
                modelButton,
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        dp(44)
                )
        );


        root.addView(
                modelBar,
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        ViewGroup.LayoutParams.WRAP_CONTENT
                )
        );


        // ==========================================================
        // CHAT
        // ==========================================================

        scroll =
                new ScrollView(this);

        scroll.setFillViewport(true);


        messages =
                new LinearLayout(this);

        messages.setOrientation(
                LinearLayout.VERTICAL
        );

        messages.setPadding(
                dp(12),
                dp(12),
                dp(12),
                dp(12)
        );


        scroll.addView(messages);


        root.addView(
                scroll,
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        0,
                        1
                )
        );


        // ==========================================================
        // STATUS
        // ==========================================================

        status =
                text(
                        "Ready",
                        11,
                        Color.GRAY
                );

        status.setPadding(
                dp(14),
                dp(4),
                dp(14),
                dp(4)
        );

        root.addView(
                status
        );


        // ==========================================================
        // INPUT BAR
        // ==========================================================

        LinearLayout inputBar =
                new LinearLayout(this);

        inputBar.setOrientation(
                LinearLayout.HORIZONTAL
        );

        inputBar.setPadding(
                dp(10),
                dp(8),
                dp(10),
                dp(10)
        );


        input =
                new EditText(this);

        input.setHint(
                "Ask anything..."
        );

        input.setTextColor(
                Color.WHITE
        );

        input.setHintTextColor(
                Color.GRAY
        );

        input.setSingleLine(false);

        input.setMaxLines(4);


        inputBar.addView(
                input,
                new LinearLayout.LayoutParams(
                        0,
                        ViewGroup.LayoutParams.WRAP_CONTENT,
                        1
                )
        );


        sendButton =
                new Button(this);

        sendButton.setText(
                "SEND"
        );

        sendButton.setOnClickListener(
                v -> sendOrStop()
        );


        inputBar.addView(
                sendButton,
                new LinearLayout.LayoutParams(
                        dp(85),
                        dp(52)
                )
        );


        root.addView(
                inputBar
        );


        setContentView(root);


        addMessage(
                "JARVIS",
                "I'm ready. Choose a GGUF model if one was not detected automatically."
        );
    }


    // ==============================================================
    // MODEL DISCOVERY
    // ==============================================================

    private void findModelAutomatically() {

        new Thread(() -> {

            File found = findGGUF();

            mainHandler.post(() -> {

                if (found != null) {

                    modelFile = found;

                    modelStatus.setText(
                            "Model: " +
                            found.getName()
                    );

                    status.setText(
                            "Model found. Ready."
                    );

                } else {

                    modelStatus.setText(
                            "Model: not found"
                    );

                    status.setText(
                            "Choose your GGUF model."
                    );
                }
            });

        }).start();
    }


    private File findGGUF() {

        ArrayList<File> roots =
                new ArrayList<>();


        roots.add(
                new File(
                        "/storage/emulated/0"
                )
        );


        roots.add(
                new File(
                        "/sdcard"
                )
        );


        File storage =
                new File("/storage");

        File[] storageRoots =
                storage.listFiles();


        if (storageRoots != null) {

            for (File f : storageRoots) {

                if (f.isDirectory()) {
                    roots.add(f);
                }
            }
        }


        for (File rootDir : roots) {

            File result =
                    searchForModel(
                            rootDir,
                            0
                    );

            if (result != null) {
                return result;
            }
        }


        return null;
    }


    private File searchForModel(
            File directory,
            int depth) {

        if (directory == null ||
                !directory.exists() ||
                !directory.isDirectory()) {

            return null;
        }


        if (depth > 7) {
            return null;
        }


        String path =
                directory.getAbsolutePath();


        /*
         * Prioritize the exact location used by
         * the user's current Termux model setup.
         */

        if (path.contains(
                "com.termux/files/home/storage/external-1/AI-Models"
        )) {

            File[] files =
                    directory.listFiles();

            if (files != null) {

                for (File f : files) {

                    if (f.isFile() &&
                            f.getName().toLowerCase()
                                    .endsWith(".gguf")) {

                        return f;
                    }
                }
            }
        }


        File[] files =
                directory.listFiles();


        if (files == null) {
            return null;
        }


        for (File f : files) {

            if (f.isFile()) {

                String name =
                        f.getName().toLowerCase();

                if (name.endsWith(".gguf") &&
                        name.contains("qwen3")) {

                    return f;
                }
            }
        }


        /*
         * Search directories.
         */

        for (File f : files) {

            if (!f.isDirectory()) {
                continue;
            }


            String name =
                    f.getName();


            /*
             * Avoid huge or irrelevant directories.
             */

            if (name.equals("Android") ||
                    name.equals("DCIM") ||
                    name.equals("Pictures") ||
                    name.equals("Movies") ||
                    name.equals("Music") ||
                    name.equals("Download")) {

                if (depth > 1) {
                    continue;
                }
            }


            File result =
                    searchForModel(
                            f,
                            depth + 1
                    );


            if (result != null) {
                return result;
            }
        }


        return null;
    }


    private void chooseModel() {

        Intent intent =
                new Intent(
                        Intent.ACTION_OPEN_DOCUMENT
                );

        intent.setType(
                "*/*"
        );

        intent.addCategory(
                Intent.CATEGORY_OPENABLE
        );


        startActivityForResult(
                intent,
                REQUEST_MODEL
        );
    }


    @Override
    protected void onActivityResult(
            int requestCode,
            int resultCode,
            Intent data) {

        super.onActivityResult(
                requestCode,
                resultCode,
                data
        );


        if (requestCode != REQUEST_MODEL ||
                resultCode != RESULT_OK ||
                data == null ||
                data.getData() == null) {

            return;
        }


        Uri uri =
                data.getData();


        /*
         * Try to resolve a real filesystem path.
         *
         * Android 8.1 gives us considerably more direct
         * filesystem access than newer Android versions.
         */

        String path =
                uri.getPath();


        if (path != null &&
                path.endsWith(".gguf")) {

            File f =
                    new File(path);

            if (f.exists()) {

                modelFile = f;

                modelStatus.setText(
                        "Model: " +
                        f.getName()
                );

                status.setText(
                        "Model selected."
                );

                return;
            }
        }


        /*
         * If the picker returns a content URI that cannot be
         * converted to a normal filesystem path, explain the
         * situation rather than silently copying 462 MB.
         */

        status.setText(
                "Picker returned a content URI. " +
                "Use the model path shown by your file manager."
        );


        addMessage(
                "JARVIS",
                "I could not obtain a direct filesystem path from that picker. " +
                "For this first prototype, use the model path directly on the device."
        );
    }


    // ==============================================================
    // CHAT
    // ==============================================================

    private void sendOrStop() {

        if (generating.get()) {

            stopGeneration();

        } else {

            sendMessage();
        }
    }


    private void sendMessage() {

        if (modelFile == null ||
                !modelFile.exists()) {

            addMessage(
                    "JARVIS",
                    "No GGUF model is available. Choose your Qwen3 GGUF model first."
            );

            return;
        }


        String question =
                input.getText()
                        .toString()
                        .trim();


        if (question.length() == 0) {
            return;
        }


        input.setText("");


        addMessage(
                "YOU",
                question
        );


        TextView answerView =
                addStreamingMessage();


        history.add(
                new String[]{
                        "user",
                        question
                }
        );


        generating.set(true);

        sendButton.setText(
                "STOP"
        );

        status.setText(
                "Generating..."
        );


        new Thread(() -> {

            runLlama(
                    answerView
            );

        }).start();
    }


    private String buildPrompt() {

        StringBuilder p =
                new StringBuilder();


        /*
         * Qwen3 ChatML format.
         */

        p.append(
                "<|im_start|>system\n"
        );

        p.append(
                SYSTEM_PROMPT
        );

        p.append(
                "\n<|im_end|>\n"
        );


        for (String[] msg : history) {

            p.append(
                    "<|im_start|>"
            );

            p.append(
                    msg[0]
            );

            p.append(
                    "\n"
            );

            p.append(
                    msg[1]
            );

            p.append(
                    "\n<|im_end|>\n"
            );
        }


        p.append(
                "<|im_start|>assistant\n"
        );


        return p.toString();
    }


    private void runLlama(
            TextView answerView) {

        Process process = null;


        try {

            File executable =
                    new File(
                            getFilesDir(),
                            "llama-cli"
                    );


            installExecutable(executable);


            String prompt =
                    buildPrompt();


            ArrayList<String> command =
                    new ArrayList<>();


            command.add(
                    executable.getAbsolutePath()
            );


            command.add(
                    "-m"
            );

            command.add(
                    modelFile.getAbsolutePath()
            );


            command.add(
                    "-p"
            );

            command.add(
                    prompt
            );


            command.add(
                    "-n"
            );

            command.add(
                    "256"
            );


            command.add(
                    "--ctx-size"
            );

            command.add(
                    "1536"
            );


            command.add(
                    "--threads"
            );

            command.add(
                    "4"
            );


            command.add(
                    "--batch-size"
            );

            command.add(
                    "256"
            );


            command.add(
                    "--offline"
            );


            command.add(
                    "--no-display-prompt"
            );


            command.add(
                    "--no-show-timings"
            );


            command.add(
                    "--no-context-shift"
            );


            command.add(
                    "--temp"
            );

            command.add(
                    "0.7"
            );


            command.add(
                    "--top-k"
            );

            command.add(
                    "40"
            );


            command.add(
                    "--top-p"
            );

            command.add(
                    "0.9"
            );


            command.add(
                    "--seed"
            );

            command.add(
                    "42"
            );


            /*
             * Tell llama.cpp to use the Qwen3 chat template
             * when the pinned CLI supports it.
             */

            command.add(
                    "--jinja"
            );


            command.add(
                    "--chat-template"
            );

            command.add(
                    "qwen3"
            );


            ProcessBuilder pb =
                    new ProcessBuilder(
                            command
                    );


            pb.redirectErrorStream(true);


            process =
                    pb.start();


            llamaProcess =
                    process;


            BufferedReader reader =
                    new BufferedReader(
                            new InputStreamReader(
                                    process.getInputStream()
                            )
                    );


            StringBuilder fullAnswer =
                    new StringBuilder();


            String line;


            boolean insideThink =
                    false;


            while ((line = reader.readLine()) != null) {

                if (!generating.get()) {
                    break;
                }


                String cleaned =
                        line;


                /*
                 * Suppress Qwen3 thinking blocks.
                 */

                if (cleaned.contains(
                        "<think>"
                )) {

                    insideThink = true;

                    int start =
                            cleaned.indexOf(
                                    "<think>"
                            );

                    cleaned =
                            cleaned.substring(
                                    0,
                                    start
                            );
                }


                if (insideThink) {

                    int end =
                            cleaned.indexOf(
                                    "</think>"
                            );

                    if (end >= 0) {

                        insideThink = false;

                        cleaned =
                                cleaned.substring(
                                        end +
                                        "</think>".length()
                                );

                    } else {

                        continue;
                    }
                }


                if (cleaned.contains(
                        "<|im_end|>"
                )) {

                    cleaned =
                            cleaned.replace(
                                    "<|im_end|>",
                                    ""
                            );
                }


                if (cleaned.contains(
                        "<|endoftext|>"
                )) {

                    cleaned =
                            cleaned.replace(
                                    "<|endoftext|>",
                                    ""
                            );
                }


                if (cleaned.length() == 0) {
                    continue;
                }


                final String piece =
                        cleaned;


                fullAnswer.append(
                        piece
                );


                mainHandler.post(() -> {

                    answerView.append(
                            piece + "\n"
                    );

                    scroll.post(
                            () -> scroll.fullScroll(
                                    View.FOCUS_DOWN
                            )
                    );
                });
            }


            process.waitFor();


            String finalAnswer =
                    fullAnswer
                            .toString()
                            .trim();


            /*
             * Store the assistant response so the next request
             * has conversational context.
             */

            if (finalAnswer.length() > 0) {

                history.add(
                        new String[]{
                                "assistant",
                                finalAnswer
                        }
                );
            }


            mainHandler.post(() -> {

                if (generating.get()) {

                    status.setText(
                            "Ready"
                    );
                }
            });


        } catch (Exception e) {

            final String error =
                    e.toString();


            mainHandler.post(() -> {

                answerView.setText(
                        "Error:\n" + error
                );

                status.setText(
                        "Generation failed"
                );
            });


        } finally {

            if (process != null) {

                try {
                    process.destroy();
                } catch (Exception ignored) {
                }
            }


            llamaProcess =
                    null;


            generating.set(false);


            mainHandler.post(() -> {

                sendButton.setText(
                        "SEND"
                );

                status.setText(
                        "Ready"
                );
            });
        }
    }


    private void installExecutable(
            File destination)
            throws IOException {

        if (destination.exists() &&
                destination.length() > 100000) {

            destination.setExecutable(
                    true
            );

            return;
        }


        InputStream inputStream =
                getAssets().open(
                        "llama-cli"
                );


        FileOutputStream output =
                new FileOutputStream(
                        destination
                );


        byte[] buffer =
                new byte[8192];


        int count;


        try {

            while ((count =
                    inputStream.read(buffer)) != -1) {

                output.write(
                        buffer,
                        0,
                        count
                );
            }

        } finally {

            try {
                inputStream.close();
            } catch (Exception ignored) {
            }

            try {
                output.close();
            } catch (Exception ignored) {
            }
        }


        if (!destination.setExecutable(
                true,
                false
        )) {

            /*
             * Android 8.1 allows the compatibility execution
             * path because this application targets API 28.
             */

            Runtime.getRuntime().exec(
                    new String[]{
                            "/system/bin/chmod",
                            "755",
                            destination.getAbsolutePath()
                    }
            );
        }
    }


    private void stopGeneration() {

        generating.set(
                false
        );


        Process p =
                llamaProcess;


        if (p != null) {

            try {

                p.destroy();

            } catch (Exception ignored) {
            }


            try {

                if (Build.VERSION.SDK_INT >= 26) {
                    p.destroyForcibly();
                }

            } catch (Exception ignored) {
            }
        }


        llamaProcess =
                null;


        sendButton.setText(
                "SEND"
        );


        status.setText(
                "Stopped"
        );
    }


    // ==============================================================
    // UI MESSAGE HELPERS
    // ==============================================================

    private void addMessage(
            String who,
            String message) {

        TextView view =
                text(
                        who + "\n\n" + message,
                        15,
                        Color.WHITE
                );


        view.setPadding(
                dp(14),
                dp(12),
                dp(14),
                dp(12)
        );


        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        ViewGroup.LayoutParams.WRAP_CONTENT
                );


        params.setMargins(
                dp(4),
                dp(5),
                dp(4),
                dp(5)
        );


        messages.addView(
                view,
                params
        );


        scroll.post(
                () -> scroll.fullScroll(
                        View.FOCUS_DOWN
                )
        );
    }


    private TextView addStreamingMessage() {

        TextView view =
                text(
                        "JARVIS\n\n",
                        15,
                        Color.WHITE
                );


        view.setPadding(
                dp(14),
                dp(12),
                dp(14),
                dp(12)
        );


        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        ViewGroup.LayoutParams.WRAP_CONTENT
                );


        params.setMargins(
                dp(4),
                dp(5),
                dp(4),
                dp(5)
        );


        messages.addView(
                view,
                params
        );


        return view;
    }


    @Override
    protected void onDestroy() {

        stopGeneration();

        super.onDestroy();
    }
}
