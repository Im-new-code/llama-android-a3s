name: Build JARVIS Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "platform-tools" \
                     "ndk;27.2.12479018"

      # ------------------------------------------------------------
      # Download the exact JARVIS Android source snapshot
      # ------------------------------------------------------------
      - name: Download JARVIS source
        env:
          SOURCE_URL: https://raw.githubusercontent.com/Im-new-code/llama-android-a3s/main/jarvis-source.zip
        run: |
          rm -rf jarvis-src
          mkdir -p jarvis-src

          wget -q "$SOURCE_URL" -O jarvis-source.zip
          unzip -q jarvis-source.zip -d jarvis-src

          test -f jarvis-src/app/build.gradle
          test -f jarvis-src/app/src/main/java/com/jarvis/local/ai/LlamaCliEngine.java

          echo "JARVIS source extracted successfully."

      # ------------------------------------------------------------
      # Sherpa ONNX
      # ------------------------------------------------------------
      - name: Download Sherpa ONNX Android runtime
        run: |
          mkdir -p jarvis-src/app/libs

          wget -q \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar \
            -O jarvis-src/app/libs/sherpa-onnx-1.13.8.aar

          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  jarvis-src/app/libs/sherpa-onnx-1.13.8.aar" \
            | sha256sum -c -

      # ------------------------------------------------------------
      # Build llama.cpp for Android arm64-v8a
      # ------------------------------------------------------------
      - name: Clone llama.cpp
        run: |
          rm -rf llama.cpp
          git clone https://github.com/ggml-org/llama.cpp.git

          cd llama.cpp
          git checkout b78db3b

          echo "Using llama.cpp commit:"
          git rev-parse HEAD

      - name: Build Android llama-cli and shared libraries
        run: |
          cd llama.cpp

          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"

          rm -rf build-android

          cmake \
            -S . \
            -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-27 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON

          cmake \
            --build build-android \
            --config Release \
            --target llama-cli \
            -j2

          echo
          echo "===== llama-cli ====="
          ls -lh build-android/bin/llama-cli

          test -f build-android/bin/llama-cli

          echo
          echo "===== Android shared libraries ====="
          find build-android \
            -type f \
            -name "*.so" \
            -print

          echo
          echo "===== Checking for required libraries ====="

          test -f "$(find build-android -type f -name 'libllama.so' | head -n 1)"

          SO_COUNT="$(find build-android -type f -name '*.so' | wc -l)"

          if [ "$SO_COUNT" -eq 0 ]; then
            echo "ERROR: No shared libraries were generated."
            exit 1
          fi

          echo "Found $SO_COUNT Android shared libraries."

      # ------------------------------------------------------------
      # Copy llama runtime into the exact asset structure expected
      # by LlamaCliEngine.java
      #
      # Expected:
      #
      # app/src/main/assets/
      # ├── llama-cli
      # └── llama-libs/
      #     ├── libllama.so
      #     ├── libggml.so
      #     ├── libggml-base.so
      #     └── other required .so files
      # ------------------------------------------------------------
      - name: Package llama runtime into JARVIS assets
        run: |
          mkdir -p jarvis-src/app/src/main/assets/llama-libs

          cp llama.cpp/build-android/bin/llama-cli \
             jarvis-src/app/src/main/assets/llama-cli

          chmod 644 jarvis-src/app/src/main/assets/llama-cli

          find llama.cpp/build-android \
            -type f \
            -name "*.so" \
            -exec cp {} jarvis-src/app/src/main/assets/llama-libs/ \;

          chmod 644 jarvis-src/app/src/main/assets/llama-libs/*.so

          echo
          echo "===== JARVIS llama assets ====="

          ls -lah jarvis-src/app/src/main/assets
          ls -lah jarvis-src/app/src/main/assets/llama-libs

          echo
          echo "===== Required asset checks ====="

          test -f jarvis-src/app/src/main/assets/llama-cli
          test -f jarvis-src/app/src/main/assets/llama-libs/libllama.so

          LIB_COUNT="$(find jarvis-src/app/src/main/assets/llama-libs \
            -maxdepth 1 \
            -type f \
            -name '*.so' \
            | wc -l)"

          if [ "$LIB_COUNT" -eq 0 ]; then
            echo "ERROR: llama-libs directory is empty."
            exit 1
          fi

          echo "Packaged $LIB_COUNT native libraries."

      # ------------------------------------------------------------
      # Verify the llama-cli binary and its native dependencies
      # ------------------------------------------------------------
      - name: Inspect llama-cli dependencies
        run: |
          echo "===== llama-cli file type ====="
          file jarvis-src/app/src/main/assets/llama-cli

          echo
          echo "===== llama-cli dynamic dependencies ====="

          readelf -d jarvis-src/app/src/main/assets/llama-cli \
            | grep NEEDED || true

          echo
          echo "===== Packaged libraries ====="

          find jarvis-src/app/src/main/assets/llama-libs \
            -maxdepth 1 \
            -type f \
            -name "*.so" \
            -printf "%f\n" \
            | sort

      # ------------------------------------------------------------
      # Build JARVIS APK
      # ------------------------------------------------------------
      - name: Build debug APK
        working-directory: jarvis-src
        run: |
          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ------------------------------------------------------------
      # Inspect APK BEFORE uploading it
      # ------------------------------------------------------------
      - name: Verify APK contents
        run: |
          APK="jarvis-src/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "===== APK ====="
          ls -lh "$APK"

          echo
          echo "===== llama assets inside APK ====="

          unzip -l "$APK" \
            | grep -E 'assets/llama-cli|assets/llama-libs/.*\.so' \
            || true

          echo
          echo "===== Required APK asset checks ====="

          unzip -l "$APK" | grep -q 'assets/llama-cli'
          unzip -l "$APK" | grep -q 'assets/llama-libs/libllama.so'

          APK_SO_COUNT="$(
            unzip -l "$APK" \
              | grep -E 'assets/llama-libs/.*\.so$' \
              | wc -l
          )"

          if [ "$APK_SO_COUNT" -eq 0 ]; then
            echo "ERROR: APK contains no llama native libraries."
            exit 1
          fi

          echo
          echo "APK contains $APK_SO_COUNT llama native libraries."

      # ------------------------------------------------------------
      # Upload final APK
      # ------------------------------------------------------------
      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: jarvis-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
