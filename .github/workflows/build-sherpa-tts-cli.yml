name: Build Sherpa ONNX Android ARM64 TTS CLI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Sherpa ONNX
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          fetch-depth: 1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"

          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"

          test -d "$ANDROID_NDK"

      - name: Build Sherpa ONNX Android ARM64 TTS CLI
        run: |
          set -e

          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"

          # Android 8.1 compatible baseline.
          # NNAPI is not needed for this CPU TTS test.
          export SHERPA_ONNX_ANDROID_PLATFORM=android-21

          export SHERPA_ONNX_ENABLE_TTS=ON
          export SHERPA_ONNX_ENABLE_BINARY=ON

          export SHERPA_ONNX_ENABLE_JNI=OFF
          export SHERPA_ONNX_ENABLE_PYTHON=OFF
          export SHERPA_ONNX_ENABLE_TESTS=OFF
          export SHERPA_ONNX_ENABLE_CHECK=OFF
          export SHERPA_ONNX_ENABLE_PORTAUDIO=OFF
          export SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF
          export SHERPA_ONNX_ENABLE_C_API=OFF

          # Use the normal shared ONNX Runtime build.
          export BUILD_SHARED_LIBS=ON

          echo "========================================"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "SHERPA_ONNX_ANDROID_PLATFORM=$SHERPA_ONNX_ANDROID_PLATFORM"
          echo "SHERPA_ONNX_ENABLE_TTS=$SHERPA_ONNX_ENABLE_TTS"
          echo "SHERPA_ONNX_ENABLE_BINARY=$SHERPA_ONNX_ENABLE_BINARY"
          echo "SHERPA_ONNX_ENABLE_JNI=$SHERPA_ONNX_ENABLE_JNI"
          echo "SHERPA_ONNX_ENABLE_C_API=$SHERPA_ONNX_ENABLE_C_API"
          echo "BUILD_SHARED_LIBS=$BUILD_SHARED_LIBS"
          echo "========================================"

          chmod +x build-android-arm64-v8a.sh

          ./build-android-arm64-v8a.sh

      - name: Verify build
        run: |
          set -e

          echo "========================================"
          echo "Installed files"
          echo "========================================"

          find build-android-arm64-v8a/install \
            -maxdepth 3 \
            -type f \
            -exec ls -lh {} \;

          echo
          echo "========================================"
          echo "TTS executable"
          echo "========================================"

          test -f \
            build-android-arm64-v8a/install/bin/sherpa-onnx-offline-tts

          file \
            build-android-arm64-v8a/install/bin/sherpa-onnx-offline-tts

          echo
          echo "========================================"
          echo "Runtime libraries"
          echo "========================================"

          ls -lh build-android-arm64-v8a/install/lib/

      - name: Package TTS CLI and libraries
        run: |
          set -e

          mkdir -p package

          cp \
            build-android-arm64-v8a/install/bin/sherpa-onnx-offline-tts \
            package/

          cp \
            build-android-arm64-v8a/install/lib/libsherpa-onnx-core.so \
            package/ \
            2>/dev/null || true

          cp \
            build-android-arm64-v8a/install/lib/libonnxruntime.so \
            package/

          chmod +x package/sherpa-onnx-offline-tts

          echo "========================================"
          echo "Package"
          echo "========================================"

          ls -lh package/

          file package/*

          tar \
            -cjf \
            sherpa-tts-android-arm64.tar.bz2 \
            -C package \
            .

          echo
          echo "Archive:"
          ls -lh sherpa-tts-android-arm64.tar.bz2

      - name: Upload TTS CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-tts-android-arm64
          path: sherpa-tts-android-arm64.tar.bz2
          if-no-files-found: error
