name: Build Sherpa ONNX Android ARM64 TTS CLI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android ARM64 TTS CLI
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Sherpa ONNX
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          ref: v1.13.7
          fetch-depth: 1

      - name: Show Sherpa version
        shell: bash
        run: |
          echo "Sherpa ONNX source:"
          git describe --tags --always || true
          git rev-parse HEAD

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "ndk;22.1.7171670"

          test -d "$ANDROID_HOME/ndk/22.1.7171670"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=$ANDROID_HOME/ndk/22.1.7171670"

      - name: Build Sherpa ONNX ARM64 TTS CLI
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK="$ANDROID_HOME/ndk/22.1.7171670"

          # Your phone is Android 8.1 / API 27.
          # API 21 is Sherpa's normal Android baseline and is compatible
          # with Android 8.1.
          export SHERPA_ONNX_ANDROID_PLATFORM=android-21

          # Use an Android ONNX Runtime release that avoids the
          # 1.28.2 linker problem seen in the failed build.
          export SHERPA_ONNX_ONNXRUNTIME_VERSION=1.27.1

          # Only functionality needed for this experiment.
          export SHERPA_ONNX_ENABLE_TTS=ON
          export SHERPA_ONNX_ENABLE_BINARY=ON

          export SHERPA_ONNX_ENABLE_JNI=OFF
          export SHERPA_ONNX_ENABLE_C_API=OFF
          export SHERPA_ONNX_ENABLE_PYTHON=OFF
          export SHERPA_ONNX_ENABLE_TESTS=OFF
          export SHERPA_ONNX_ENABLE_CHECK=OFF
          export SHERPA_ONNX_ENABLE_PORTAUDIO=OFF
          export SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF
          export SHERPA_ONNX_ENABLE_RKNN=OFF
          export SHERPA_ONNX_ENABLE_QNN=OFF

          # The Android ONNX Runtime shared library contains references
          # to Android libc symbols that newer lld rejects when linking
          # an executable. Allow the Android loader to resolve them at
          # runtime.
          export CMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined"
          export CMAKE_SHARED_LINKER_FLAGS="-Wl,--allow-shlib-undefined"

          echo "=============================================="
          echo "Sherpa ONNX"
          echo "=============================================="
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_PLATFORM=$SHERPA_ONNX_ANDROID_PLATFORM"
          echo "ONNX Runtime=$SHERPA_ONNX_ONNXRUNTIME_VERSION"
          echo "TTS=$SHERPA_ONNX_ENABLE_TTS"
          echo "Binary=$SHERPA_ONNX_ENABLE_BINARY"
          echo "JNI=$SHERPA_ONNX_ENABLE_JNI"
          echo "C API=$SHERPA_ONNX_ENABLE_C_API"
          echo "RKNN=$SHERPA_ONNX_ENABLE_RKNN"
          echo "QNN=$SHERPA_ONNX_ENABLE_QNN"
          echo "=============================================="

          chmod +x build-android-arm64-v8a.sh

          ./build-android-arm64-v8a.sh

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail

          INSTALL="build-android-arm64-v8a/install"

          echo "=============================================="
          echo "Installed files"
          echo "=============================================="

          find "$INSTALL" \
            -type f \
            -exec ls -lh {} \;

          echo
          echo "=============================================="
          echo "TTS executable"
          echo "=============================================="

          test -f "$INSTALL/bin/sherpa-onnx-offline-tts"

          file "$INSTALL/bin/sherpa-onnx-offline-tts"

          echo
          echo "=============================================="
          echo "Runtime libraries"
          echo "=============================================="

          find "$INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name "*.so" \
            -exec ls -lh {} \;

          echo
          echo "=============================================="
          echo "Executable dependencies"
          echo "=============================================="

          readelf -d "$INSTALL/bin/sherpa-onnx-offline-tts" || true

      - name: Prepare Android ARM64 package
        shell: bash
        run: |
          set -euo pipefail

          INSTALL="build-android-arm64-v8a/install"

          rm -rf package
          mkdir -p package/lib

          # Copy the executable.
          cp "$INSTALL/bin/sherpa-onnx-offline-tts" \
             package/

          chmod +x package/sherpa-onnx-offline-tts

          # Copy every required shared library produced by Sherpa.
          find "$INSTALL/lib" \
            -maxdepth 1 \
            -type f \
            -name "*.so" \
            -exec cp {} package/lib/ \;

          echo "=============================================="
          echo "Final package"
          echo "=============================================="

          find package \
            -type f \
            -exec ls -lh {} \;

          echo
          echo "=============================================="
          echo "Executable architecture"
          echo "=============================================="

          file package/sherpa-onnx-offline-tts

          echo
          echo "=============================================="
          echo "Creating archive"
          echo "=============================================="

          tar -cjf sherpa-tts-android-arm64.tar.bz2 \
            -C package .

          ls -lh sherpa-tts-android-arm64.tar.bz2

      - name: Upload Android ARM64 TTS package
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-tts-android-arm64
          path: sherpa-tts-android-arm64.tar.bz2
          if-no-files-found: error
