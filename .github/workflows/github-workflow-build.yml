name: Build AI Companion Prototype

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "platform-tools" \
                     "cmake;3.22.1" \
                     "ndk;27.2.12479018"

      - name: Download prototype source
        env:
          SOURCE_URL: https://raw.githubusercontent.com/Im-new-code/llama-android-a3s/main/jarvis-source.zip
        run: |
          rm -rf companion-src
          mkdir -p companion-src

          wget -q "$SOURCE_URL" -O source.zip

          unzip -q source.zip -d companion-src

          echo "=== Prototype source ==="
          find companion-src -maxdepth 3 -type f | sort

      - name: Verify prototype source
        working-directory: companion-src
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/imnewcode/companion/MainActivity.java
          test -f app/src/main/java/com/imnewcode/companion/live2d/Live2DView.java
          test -f app/src/main/java/com/imnewcode/companion/live2d/Live2DBridge.java

          test -f app/src/main/cpp/live2d/CMakeLists.txt

          test -f app/src/main/cpp/live2d/sdk/Core/include/Live2DCubismCore.h
          test -f app/src/main/cpp/live2d/sdk/Core/lib/android/arm64-v8a/libLive2DCubismCore.a

          test -f app/src/main/assets/koharu/koharu.model3.json
          test -f app/src/main/assets/koharu/koharu.moc3
          test -f app/src/main/assets/koharu/koharu.physics3.json
          test -f app/src/main/assets/koharu/koharu.2048/texture_00.png

          echo "Prototype source verification passed."

      - name: Create Gradle wrapper
        working-directory: companion-src
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: companion-src
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        working-directory: companion-src
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "=== APK ==="
          ls -lh "$APK"

          echo "=== APK contents ==="
          unzip -l "$APK" | grep -E \
            'lib/arm64-v8a/liblive2d\.so|assets/koharu/|AndroidManifest.xml' \
            || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Companion-Prototype-v0.1.0-debug
          path: companion-src/app/build/outputs/apk/debug/app-debug.apk
